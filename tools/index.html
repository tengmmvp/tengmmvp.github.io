<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<!--gen:head-title:start-->
  <title>工具 · TengMMVP</title>
  <meta name="description" content="TengMMVP 的在线小工具集合：沉淀思考，分享知识。">
<!--gen:head-title:end-->
<!--gen:csp:start-->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<!--gen:csp:end-->
  <script src="/shared/theme-boot.js"></script>
  <link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/assets/icons/favicon-32x32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="/assets/icons/favicon-16x16.png" type="image/png" sizes="16x16">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="/assets/icons/site.webmanifest">
  <link rel="preload" href="/assets/fonts/eb-garamond-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/jetbrains-mono-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="modulepreload" href="/shared/tmm.js">
  <link rel="stylesheet" href="/shared/theme.css">
  <style>
    .page-intro { padding: var(--s12) 0 var(--s6); }
    .list-toolbar { display: grid; gap: var(--s3); margin-bottom: var(--s6); }
    @media (min-width: 641px) { .list-toolbar { grid-template-columns: minmax(240px, 1fr) 2fr; align-items: center; } }
    .tool-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: var(--s4); padding-bottom: var(--s8); }
    .tool { display: flex; flex-direction: column; padding: var(--s4); }
    .tool-head { display: flex; align-items: center; gap: var(--s3); margin-bottom: var(--s2); }
    .tool-glyph { width: 2.2rem; height: 2.2rem; display: grid; place-items: center; font-family: var(--font-serif); font-size: 1.2rem; color: var(--color-accent-ink); border: var(--hairline) solid var(--color-border); border-radius: var(--radius); background: var(--color-surface-alt); flex: none; }
    .tool-name { margin: 0; }
    .tool-name a { color: var(--color-text); text-decoration: none; }
    .tool-name a:hover { color: var(--color-accent-ink); }
    .tool-desc { color: var(--color-text-muted); font-size: .9rem; margin-bottom: var(--s3); flex: 1; }
    .tool-foot { display: flex; justify-content: space-between; align-items: center; gap: var(--s2); }
    .tool-open { font-family: var(--font-mono); font-size: .76rem; white-space: nowrap; }
  </style>
</head>
<body>
  <noscript><p class="noscript-note">已展示静态内容，筛选与搜索需要 JavaScript。</p></noscript>

<!--gen:chrome:header:start-->
  <header class="site-header">
    <div class="container">
      <a href="/" class="site-logo">TengMMVP<span class="dot">.</span></a>
      <nav class="site-nav" aria-label="主导航">
        <a href="/">首页</a>
        <a href="/blog/">博客</a>
        <a href="/tools/" aria-current="page">工具</a>
        <button class="theme-toggle" id="themeToggle" type="button">主题</button>
      </nav>
    </div>
  </header>
<!--gen:chrome:header:end-->

  <main>
    <section class="page-intro">
      <div class="container">
        <div class="section-head">
          <span class="section-kicker">Toolbox</span>
          <h1 class="section-title">工具</h1>
        </div>
        <div class="list-toolbar">
          <input class="input" id="toolSearch" type="search" placeholder="搜索名称 / 描述 / 分类…" aria-label="搜索工具">
          <div class="chips" id="toolCats" role="group" aria-label="按分类筛选"></div>
        </div>
        <p class="visually-hidden" id="listStatus" role="status" aria-live="polite"></p>
        <div class="tool-grid" data-region="tools-list">
<!--gen:tools-list:start-->
          <article class="tool card">
            <div class="tool-head">
              <span class="tool-glyph" aria-hidden="true">J</span>
              <h3 class="tool-name"><a href="/tools/json-tool/">JSON 整理台</a></h3>
            </div>
            <p class="tool-desc">字段排序与格式化，暗色终端风格的 JSON 工作台。</p>
            <div class="tool-foot">
              <p class="chips"><span class="chip">开发</span><span class="chip">2026-10-09</span></p>
              <a class="tool-open" href="/tools/json-tool/">打开 →</a>
            </div>
          </article>
<!--gen:tools-list:end-->
        </div>
      </div>
    </section>
  </main>

<!--gen:chrome:footer:start-->
  <footer class="site-footer">
    <div class="container">
      <p>© 2026 TengMMVP · 沉淀思考，分享知识</p>
    </div>
  </footer>
<!--gen:chrome:footer:end-->

  <script type="module" src="/shared/page-tools.js"></script>
</body>
</html>
